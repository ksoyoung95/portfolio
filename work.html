<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>작업 상세 | 강소영 포트폴리오</title>
  <meta name="description" content="강소영 포트폴리오 작업 상세 페이지" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./css/work.css?v=10f2120" />
</head>

<body>
  <header class="siteHeader">
    <div class="workContainer headerRow">
      <a class="brand" href="./index.html#home">soYoung</a>
      <nav class="siteNav" aria-label="주 메뉴">
        <a href="./index.html#home">Home</a>
        <a href="./index.html#about">About</a>
        <a href="./index.html#portfolio">Portfolio</a>
        <a href="./index.html#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main class="workDetailPage" id="top">

    <!-- 상단 바 -->
    <section class="workTopBar">
      <div class="workContainer workTopBarInner">
        <button class="workBackBtn" type="button" id="backBtn" aria-label="포트폴리오 목록으로 돌아가기">
          <img src="./images/profile/ioc/Expand_left.png" alt="" aria-hidden="true" />
        </button>
        <span class="workTopLabel">포트폴리오</span>
      </div>
    </section>

    <!-- 프로젝트 기본 정보 -->
    <section class="workIntro">
      <div class="workContainer">
        <div class="workEyebrow">
          <p class="workCategory" id="workCategory"></p>
          <span class="workEyebrowDot" aria-hidden="true">·</span>
          <p class="workClient" id="workClient"></p>
        </div>

        <div class="workTitleGroup">
          <h1 class="workMainTitle" id="workTitle"></h1>
          <p class="workSubText" id="workSubText"></p>
        </div>

        <div class="workMetaGrid">
          <div class="workMetaItem">
            <span class="workMetaLabel">역할</span>
            <p class="workMetaValue" id="workRole"></p>
          </div>
          <div class="workMetaItem">
            <span class="workMetaLabel">기여도</span>
            <p class="workMetaValue" id="workContribution"></p>
          </div>
          <div class="workMetaItem">
            <span class="workMetaLabel">툴</span>
            <p class="workMetaValue" id="workTools"></p>
          </div>
        </div>

        <div class="workColorSection">
          <h2 class="workSectionSubTitle">Color</h2>
          <div class="workColorList" id="workColors"></div>
        </div>
      </div>
    </section>

    <!-- 일반 상세 이미지 (상세 이미지가 없는 탭형 작업은 JS에서 섹션째 숨김) -->
    <section class="workImageSection">
      <div class="workContainer workImageContainer">
        <h2 class="workSectionSubTitle workDetailImageTitle">Detailed Image</h2>
      </div>
      <div class="workFullImageWrap" id="workFullImageWrap"></div>
    </section>

    <!-- 탭형 상세페이지 -->
    <section class="workHeroSection" id="workHeroSection">
      <div id="workHeroWrap"></div>
    </section>

    <section class="workTabSection" id="workTabSection">
      <div class="workTabNav" id="workTabNav"></div>
    </section>

    <section class="workTabContentSection" id="workTabContentSection">
      <div id="workTabContent"></div>
    </section>

    <!-- 이전/다음 프로젝트 + 문의 -->
    <section class="workPagerSection">
      <div class="workContainer">
        <nav class="workPager" id="workPager" aria-label="다른 프로젝트"></nav>

        <div class="workPagerActions">
          <a class="workActionBtn isGhost" href="./index.html#portfolio" id="listLink">전체 포트폴리오 보기</a>
          <a class="workActionBtn isPrimary" href="mailto:sydh0714@naver.com">프로젝트 문의하기</a>
        </div>
      </div>
    </section>

    <a class="workFloatingTop" href="#top" aria-label="맨 위로" id="workTopBtn">
      <img src="./images/profile/ioc/Expand_up.png" alt="" aria-hidden="true" />
    </a>
  </main>

  <script src="./js/workdata.js"></script>
  <script src="./js/work.js"></script>
</body>

</html>
